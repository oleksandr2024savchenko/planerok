[project]
name = "planer-backend"
version = "0.1.0"
description = "Personal planner: Telegram bot + API for the Mini App"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.13,<4",
    "alembic>=1.13",
    "apscheduler>=3.10,<4",
    "asyncpg>=0.29",
    "fastapi>=0.115",
    "google-api-python-client>=2.150",
    "google-auth-oauthlib>=1.2",
    "google-genai>=1.40",
    "psycopg[binary]>=3.2",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "redis>=5.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "tzdata>=2024.1",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = [
    "httpx2",
    "pytest>=8",
]

[tool.pytest.ini_options]
pythonpath = ["."]
