server {
    listen 3000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Hashed build files never change: cache them for a year.
    location /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # The version stamp must always come fresh, or the page never sees a new deploy.
    location = /version.json {
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    # HTML is revalidated on every open, so Telegram's webview picks up a new build.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
